name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test persistence, clocks, and popover layout
        run: swift test
      - name: Build native app bundle
        run: bash scripts/build-app.sh release
